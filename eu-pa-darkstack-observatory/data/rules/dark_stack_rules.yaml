# EN: Third-party domain classification rules for 05_scrape_dark_stack.py: pattern (substring
#     of the resource domain), categoria (cdn_font, analytics, captcha, cookie_banner,
#     chat_supporto = support chat, video, sdk_generico = generic SDK, altro_terzo_parte =
#     other), vendor, organizzazione_madre (parent company, only when a verified fact; used
#     for tracker HHI). First matching rule wins.
#
# Regole di classificazione dei domini di terze parti rilevati nell'HTML dei
# siti sondati (05_scrape_dark_stack.py). Ogni regola:
#   pattern: sottostringa cercata nel dominio della risorsa (case-insensitive)
#   categoria: cdn_font | analytics | captcha | cookie_banner | chat_supporto
#              | video | sdk_generico | altro_terzo_parte
#   vendor: nome leggibile per i report
#   organizzazione_madre: OPZIONALE (seconda passata, settembre 2026) — la
#     società che controlla davvero il vendor, SOLO quando è un fatto noto
#     e non ambiguo (es. Google Fonts -> Google). Se assente, i report la
#     trattano come uguale al vendor. Usata per calcolare la concentrazione
#     (HHI) dei tracker per organizzazione madre invece che per singolo
#     dominio/vendor (vedi summarize_tracker_hhi() in 03_analyze.py) — non
#     aggiungerla per una congettura societaria non verificata: meglio
#     lasciarla assente (= vendor) che sbagliata.
#
# Vince la PRIMA regola che matcha: mettere i pattern più specifici (es. un
# sottodominio preciso) prima di quelli generici (es. il dominio radice dello
# stesso vendor), altrimenti il generico "ruba" il match.
#
# File pensato per essere esteso dalla community: aggiungere una voce non
# richiede toccare il codice Python.

- pattern: "fonts.googleapis.com"
  categoria: cdn_font
  vendor: "Google Fonts"
  organizzazione_madre: "Google"
- pattern: "fonts.gstatic.com"
  categoria: cdn_font
  vendor: "Google Fonts"
  organizzazione_madre: "Google"
- pattern: "cdnjs.cloudflare.com"
