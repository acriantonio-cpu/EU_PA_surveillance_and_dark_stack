  vendor: "unpkg"
- pattern: "use.fontawesome.com"
  categoria: cdn_font
  vendor: "Font Awesome"
- pattern: "maxcdn.bootstrapcdn.com"
  categoria: cdn_font
  vendor: "BootstrapCDN"
- pattern: "stackpath.bootstrapcdn.com"
  categoria: cdn_font
  vendor: "BootstrapCDN"

