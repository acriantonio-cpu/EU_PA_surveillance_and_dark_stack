# --------------------------------------------------------------------------
# Segnali di ente NON PUBBLICO (possibile errore nella lista di partenza).
# --------------------------------------------------------------------------
# Uso previsto: data/processed/<paese>/siti.csv può contenere hostname finiti
# lì per errore di raccolta o perché l'indice di partenza stesso include
# soggetti privati (esempio REALE trovato in data/processed/IT/siti.csv:
# "Giochi24 S.r.l." con sector=camera_commercio, codice_categoria L37 — le
# camere di commercio hanno fra gli iscritti anche aziende private, non solo
# uffici pubblici). Questi segnali NON dimostrano da soli che un hostname sia
# "sbagliato": una "società partecipata" pubblica (es. "Farmacie Comunali
# S.p.A.", "ATM S.p.A.") ha legittimamente una forma societaria privata pur
# essendo a controllo pubblico. Vanno letti come una lista di CANDIDATI da
# rivedere a mano, non come un filtro automatico da applicare senza guardare.
#
# forme_societarie: suffissi di forma societaria privata, tipicamente in
# fondo al <title> o nella riga di copyright a piè di pagina ("© 2024 Rossi
# S.r.l."). Vanno cercati come parola SEPARATA (il codice aggiunge i confini
# di parola), non come sottostringa libera come le altre categorie: "sa" o
# "ab" da soli comparirebbero troppo spesso dentro altre parole.
forme_societarie:
  it: ["s.r.l.", "srl", "s.p.a.", "spa", "s.n.c.", "s.a.s.", "società cooperativa"]
  fr: ["sarl", "sas", "sasu", "eurl", "s.a."]
  es: ["s.l.", "s.l.u.", "s.a.", "s.a.u."]
  de: ["gmbh", "ag", "kg", "ohg", "e.k."]
  nl: ["b.v.", "n.v."]
  pt: ["lda", "lda.", "s.a."]
  sv: ["ab"]
  da: ["a/s", "aps"]
  fi: ["oy", "oyj"]
  pl: ["sp. z o.o.", "s.a."]
  cs: ["s.r.o.", "a.s."]
  sk: ["s.r.o.", "a.s."]
  hu: ["kft.", "zrt.", "nyrt."]
  ro: ["s.r.l.", "s.a."]
  bg: ["оод", "еад"]
  el: ["α.ε.", "ε.π.ε.", "ι.κ.ε."]
  hr: ["d.o.o.", "d.d."]
  sl: ["d.o.o.", "d.d."]
  lt: ["uab", "ab"]
  lv: ["sia", "as"]
  et: ["oü", "as"]
  en: ["ltd", "plc", "llc", "inc.", "corp."]

# commerciale: terminologia da e-commerce/vetrina commerciale, un segnale
# indipendente dalla forma societaria (una onlus o un'associazione senza
# S.r.l. nel nome può comunque essere chiaramente un sito commerciale/non
# istituzionale). Copertura più leggera (non tutte le 24 lingue): i termini
# più diffusi bastano a intercettare la maggior parte dei casi, il resto
# resta comunque coperto dal segnale forme_societarie sopra.
commerciale:
  it: ["aggiungi al carrello", "acquista ora", "spedizione gratuita", "partita iva"]
  en: ["add to cart", "buy now", "free shipping", "shopping cart"]
  fr: ["ajouter au panier", "livraison gratuite", "acheter maintenant"]
  de: ["in den warenkorb", "kostenloser versand", "jetzt kaufen"]
  es: ["añadir al carrito", "envío gratis", "comprar ahora"]
  pt: ["adicionar ao carrinho", "envio grátis", "comprar agora"]
  nl: ["toevoegen aan winkelwagen", "gratis verzending"]
  pl: ["dodaj do koszyka", "darmowa dostawa"]
  ro: ["adaugă în coș", "livrare gratuită"]
  sv: ["lägg i varukorgen"]

