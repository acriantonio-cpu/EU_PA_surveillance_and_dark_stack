# tipo_ente_rules.yaml — parole chiave per riconoscere il TIPO DI ENTE
# (comune, provincia, scuola, ospedale, polizia, ecc.) dal testo della
# homepage, in tutte le 24 lingue ufficiali UE + inglese come lingua franca.
#
# Usato da src/08_classifica_tipo_ente.py: NON serve sapere in che lingua è
# il sito, lo script confronta il testo con TUTTE le liste di parole chiave
# di TUTTE le lingue (un comune bilingue, es. in Alto Adige/Südtirol o in
# Finlandia, può usare più di una lingua nella stessa pagina). Le parole
# chiave vanno lette come "sottostringa case-insensitive", non regex: usa
# spazi/trattini per evitare match troppo larghi (es. "e la" non è una parola
# chiave valida, "gemeinde " con lo spazio finale evita match dentro parole
# più lunghe come "Gemeindeverband" quando serve una forma esatta, ma qui si
# preferisce comunque il match permissivo: un falso positivo occasionale è
# preferibile a mancare varianti/declinazioni non previste).
#
# Non esaustivo per costruzione (24 lingue x 11 categorie): estendibile senza
# toccare il codice, stesso principio già usato per cms_signatures.yaml e
# dark_stack_rules.yaml. Le lingue con copertura più debole in questa prima
# versione (irlandese, maltese, lettone, estone) hanno solo i termini più
# comuni: un mancato riconoscimento in quei casi è più probabile che altrove.
#
# Peso dei tre punti di lettura della pagina (usato dal codice, non qui):
# titolo/tag <title> e meta description contano di più del testo del corpo,
# perché un ente pubblico tipicamente si autodichiara lì ("Comune di X",
# "Ministry of ..."); il corpo pesa meno ma copre i casi in cui
# l'autodichiarazione è solo nell'intestazione visibile della pagina.

