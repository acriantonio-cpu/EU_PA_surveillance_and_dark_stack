# --------------------------------------------------------------------------
# Override PER PAESE: voci valide solo quando classify_sites.py gira con --country XX, E SOLO se
# la lingua dichiarata dalla homepage (<html lang="...">) combacia con quella attesa (di default,
# il codice paese in minuscolo: si può dichiarare esplicitamente con 'lang' se non coincidono,
# es. un domani per un paese plurilingue). Pagina senza 'lang' dichiarato -> l'override NON scatta:
# meglio perdere un match vero che rischiare un falso positivo quando non si sa la lingua reale.
# Servono per parole utili ma troppo rischiose a livello GLOBALE perché collidono con una parola
# comune di UN'ALTRA lingua (es. "sąd" = tribunale in polacco, ma anche "sad" = triste in inglese):
# il doppio filtro (country + lang) riduce il rischio residuo quasi a zero.
# Si sommano al lessico globale, non lo sostituiscono (restano valide anche "tribunale", "court"...).
country_overrides:
  PL:
    lang: pl
    tipo_keywords:
      giustizia: ["sad!"]     # "sąd" (tribunale): rischioso globalmente (inglese "sad"=triste)
  HR:
    lang: hr
    tipo_keywords:
      giustizia: ["sud!"]     # "sud" (tribunale croato): rischioso globalmente (francese "sud"=sud)
  SK:
    lang: sk
    tipo_keywords:
      giustizia: ["sud!"]     # "súd" (tribunale slovacco): stesso motivo
  NL:
    lang: nl
    # Segnale debole (natura=privato, confidenza 0.35, MAI decisivo da solo) quando il TLD non è
    # tra questi. Base empirica: campione REALE di 60 host 'sconosciuto' etichettati a mano
    # (29-30/2026) — .nl/.org erano pubblico/terzo_settore nel 57% dei casi, contro il 2,4% di
    # .com/.fr/.de/.fi/.uk. Campione ancora piccolo (56 righe valide): da riverificare quando se ne
    # etichettano altri. '.eu' incluso perché copre organismi/consorzi europei con sede NL.
    allowed_tlds: [nl, org, eu]
    tipo_keywords:
      # sigle olandesi troppo corte per essere sicure a livello globale (RDW/UWV potrebbero essere
      # le iniziali di qualunque azienda in un'altra lingua), sicure con country+lang insieme
      agenzia_authority: ["rdw!", "uwv!"]
