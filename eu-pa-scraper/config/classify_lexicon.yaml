# Lessico del classificatore (src/classify/). Modificabile SENZA toccare il codice.
#
# Sintassi delle voci di testo (accenti e maiuscole ignorati):
#   "comune di"   corrisponde a un INIZIO parola (prefisso): trova anche "comune di milano"
#   "sindaco!"    con il "!" finale: solo parola INTERA
# I lessici sono multilingue (24 lingue UE) e volutamente compatti: le liste vanno
# arricchite guardando i falsi positivi/negativi del vostro gold set, non a priori.

# --------------------------------------------------------------------------
# Stadio 0 - hostname
# --------------------------------------------------------------------------
# Suffissi/host che indicano un ente pubblico (regex sull'host in minuscolo).
gov_suffix_patterns:
  - '(^|\.)gov(\.[a-z]{2})?$'
  - '(^|\.)gob\.[a-z]{2,3}$'
  - '(^|\.)gouv\.[a-z]{2}$'
  - '(^|\.)gv\.at$'
  - '(^|\.)bund\.de$'
  - '(^|\.)europa\.eu$'
  - '(^|\.)overheid\.nl$'
  - '(^|\.)(fgov|gov)\.be$'
  - '(^|\.)belgium\.be$'
  - '(^|\.)(vlaanderen|wallonie)\.be$'
  - '(^|\.)be\.brussels$'
  - '(^|\.)riik\.ee$'
  - '(^|\.)(gencat)\.cat$'
  - '(^|\.)euskadi\.eus$'
  - '(^|\.)xunta\.gal$'
  - '(^|\.)admin\.ch$'
  - '(^|\.)regeringen\.se$'
  - '(^|\.)gov\.uk$'
gov_suffix_confidence: 0.9

# Token nei LABEL dell'host (separati da '.' e '-'). Senza "!": il label INIZIA con il token
# (gemeentehuis, comunedimilano); con "!": il label è ESATTAMENTE il token.
host_tokens:
  comune: [comune, gemeente, mairie, ville, ayuntamiento, concello, ajuntament, camara, municipio, municipal, kommun, kommune, kunta, kaupunki, vald!, gmina, um!, ug!, mesto!, obec!, opcina, grad!, obcina, varos, primaria, dimos, gemeinde, stadt, council]
  regione_provincia: [regione, provincia, region!, regio!, landkreis, kreis!, provincie, county, landsting, diputacion, generalitat, zupanija, megye, judet, wojewodz, powiat, departement]
  polizia_sicurezza: [polizia, police, policia, politie, polizei, policja, policie, politi!, polis!, poliisi, politsei, policija, rendorseg, politia, gendarmerie, carabinieri, garda!]
  governo_centrale: [ministero, ministerio, ministere, ministerie, ministerium, ministry, ministerstvo, ministrstvo, miniszterium, regering, regjering, government, governo, gobierno, gouvernement, bundesregierung, vlada!, valitsus, hallitus, rzad!]
  scuola: [school, schule, skola, szkola, escola, escuela, colegio, lycee, gymnasium, liceo, scuola, ecole, istituto, koulu, kool!, iskola, mokykla, scoala, grundschule]
  universita: [univ, uni!, hochschule, hogeschool, egyetem, uniwersytet, yliopisto, ulikool, politecnico]
  sanita: [hospital, ospedale, ziekenhuis, krankenhaus, klinikum, hopital, sjukhus, sairaala, szpital, spital, nemocnice, slimnica, haigla, asl!, asst!, ausl!, chu!, nhs, clinic, clinica, klinik]
  emergenza: [feuerwehr, brandweer, pompiers, bomberos, bombeiros, hasici, straz, vigilidelfuoco, pompieri]
  parlamento: [parlament, parlement, bundestag, landtag, senat!, sejm!, riksdag, folketing, eduskunta, riigikogu, saeima, seimas, tweedekamer]
  giustizia: [justice, justiz, justicia, rechtbank, gericht, tribunal, giustizia, justitie]
  cultura: [museum, museo, musee, bibliothek, biblioteca, library, bibliotheek, archiv]
  # Autorità ambientali/idriche: parole di per sé inequivocabili (non collidono con imprese private),
  # per questo utilizzabili anche come token di HOSTNAME e non solo come testo di pagina.
  ambiente: [waterschap, hoogheemraadschap, omgevingsdienst]
# Label che iniziano con questi prefissi NON contano (aziende municipalizzate, banche...).
host_token_exclusions: [stadtwerke, stadtsparkasse, sparkasse, gemeentewerken, cityhotel, schoolbook, hospitality]

# --------------------------------------------------------------------------
# Stadio 3 - homepage
# --------------------------------------------------------------------------
# Peso di ciascun campo del "pacchetto di evidenza" nel punteggio.
field_weights:
  title: 3.0
  site_name: 3.0
  h1: 2.0
  description: 2.0
  jsonld: 4.0
  legal: 2.5
  footer: 1.5
  nav: 1.0
  body: 0.5
# Massimo numero di voci DISTINTE contate per campo (evita che un menu lunghissimo domini).
max_distinct_per_field: 3
# Punteggio minimo (grezzo) del tipo migliore perché produca un voto.
min_type_score: 3.0
min_nature_marker_score: 3.0

# Tipi schema.org (JSON-LD) -> tipo/natura. Segnale forte e multilingue.
jsonld_types:
  GovernmentOrganization: {natura: pubblico}
  GovernmentBuilding: {natura: pubblico}
  CityHall: {tipo: comune, natura: pubblico}
  PoliceStation: {tipo: polizia_sicurezza, natura: pubblico}
  Courthouse: {tipo: giustizia, natura: pubblico}
  FireStation: {tipo: emergenza, natura: pubblico}
  LegislativeBuilding: {tipo: parlamento, natura: pubblico}
  EmbassyOrConsulate: {tipo: governo_centrale, natura: pubblico}
  School: {tipo: scuola}
  ElementarySchool: {tipo: scuola}
  MiddleSchool: {tipo: scuola}
  HighSchool: {tipo: scuola}
  EducationalOrganization: {tipo: scuola}
  CollegeOrUniversity: {tipo: universita}
  Hospital: {tipo: sanita}
  MedicalClinic: {tipo: sanita}
  MedicalOrganization: {tipo: sanita}
  Library: {tipo: cultura}
  Museum: {tipo: cultura}
  Corporation: {natura: privato}
  LocalBusiness: {natura: privato}
  Store: {natura: privato}
  OnlineStore: {natura: privato}
  Restaurant: {natura: privato}
  Hotel: {natura: privato}
  NGO: {natura: terzo_settore}
  NewsMediaOrganization: {tipo: altro, natura: privato}

