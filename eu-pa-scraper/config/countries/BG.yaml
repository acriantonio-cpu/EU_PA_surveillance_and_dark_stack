country_code: BG
country_name: "Bulgaria"
status: ready
source_type: site_crawl # html_scrape
source_name: "Administrativen registar (IISDA) + data.egov.bg"
source_url: "https://iisda.government.bg/"    # individuare URL esatto della pagina/elenco enti da raschiare
list_selector: "TODO-selettore-CSS-riga-ente"  # ispezionare l'HTML reale con DevTools del browser
field_selectors:
  nazev: "TODO"
  web: "a::attr(href)"
  obec: "TODO"
license: "aperta"
field_mapping:
  hostname: "web"
  comune: "obec"
  regione: ""
  codice_ipa: ""
  sector: ""
notes: >
  IISDA è consultabile prevalentemente via interfaccia HTML (da raschiare).
  Prima di eseguire: aprire iisda.government.bg nel browser, individuare
  l'URL dell'elenco enti e, con DevTools, i selettori CSS di riga/nome/link.
  data.egov.bg (portale open data) va verificato come complemento/API.

# TLD "di fiducia" per continuare a esplorare un dominio anche se non e'
# elencato esplicitamente in 'allowed_domains' (si somma ad essa, non la
# sostituisce): un dominio scoperto durante il crawl e' considerato
# "interno" (e quindi esplorato anche ai livelli successivi) se il suo
# TLD nazionale o un label 'gov' compaiono tra i suoi label. Usato solo
# da source_type: site_crawl; innocuo per gli altri source_type.
allowed_tlds:
  - "bg"
  - "gov"

allowed_tlds:
  - "pl"
  - "gov"

seeds_file: "seeds.txt"
crawl_depth: 8

# ...poi, a ogni pagina visitata, raccoglie i link USCENTI (siti ufficiali
# degli enti che hanno pubblicato l'annuncio), escludendo i social:
exclude_domains:
exclude_domains:
  - "facebook.com"
  - "twitter.com"
  - "x.com"
  - "linkedin.com"
  - "xing.com"
  - "instagram.com"
  - "youtube.com"
  - "tiktok.com"
  - "pinterest.com"
  - "reddit.com"
  - "tumblr.com"
  - "flickr.com"
  - "paypal.com"
  - "amazon.com"
  - "ebay.com"
  - "wikipedia.org"
  - "wikimedia.org"
  - "wikidata.org" 
  - "archive.org"
  - "web.archive.org"
  - "aliexpress.com"
  - "etsy.com"
  - "twitch.tv"
  - "alibaba.com"
  - "medium.com"
  - "maps.google.com"
  - "google.com"

max_pages_per_level: 15000     # tetto di sicurezza: alzare per una copertura più ampia
sleep_seconds: 1.0           # pausa tra le richieste (cortesia verso il server)
input_filename: "crawl_service_bund.json"
license: "n/a (harvesting di URL pubblici, nessun contenuto riprodotto)"