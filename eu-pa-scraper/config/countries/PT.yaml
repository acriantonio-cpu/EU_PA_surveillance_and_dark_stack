country_code: PT
country_name: "Portogallo"
status: ready
source_type: site_crawl # api_json
source_name: "dados.gov.pt (CKAN/udata) + INE"
source_url: "https://dados.gov.pt/api/1/datasets/?q=administracoes+publicas"  # affinare la query verso il dataset specifico
records_path: "data"
license: "aperta"
field_mapping:
  hostname: ""                  # generalmente assente nei dataset bulk: verificare scheda per scheda
  comune: "concelho"
  regione: "distrito"
  codice_ipa: "nif"
  sector: "setor_institucional"
notes: >
  dados.gov.pt usa piattaforma tipo CKAN/udata: verificare lo slug esatto del
  dataset "Lista de entidades que integram as Administracoes Publicas" (INE,
  settore S.13) e il formato di export (spesso PDF/Excel, non API diretta).
  Per gli URL, integrare con directory settoriali (ACSS per sanità, DGEEC
  per scuole/università).

# TLD "di fiducia" per continuare a esplorare un dominio anche se non e'
# elencato esplicitamente in 'allowed_domains' (si somma ad essa, non la
# sostituisce): un dominio scoperto durante il crawl e' considerato
# "interno" (e quindi esplorato anche ai livelli successivi) se il suo
# TLD nazionale o un label 'gov' compaiono tra i suoi label. Usato solo
# da source_type: site_crawl; innocuo per gli altri source_type.
allowed_tlds:
  - "pt"
  - "gov"

website_search:
  enabled: true
  backend: duckduckgo        # oppure: wikidata
  max_queries: 50
  sleep_seconds: 2.0
  language: pt

seeds_file: "seeds.txt"
crawl_depth: 8

# ...poi, a ogni pagina visitata, raccoglie i link USCENTI (siti ufficiali
# degli enti che hanno pubblicato l'annuncio), escludendo i social:
exclude_domains:
exclude_domains:
  - "facebook.com"
  - "twitter.com"
  - "x.com"
  - "linkedin.com"
  - "xing.com"
  - "instagram.com"
  - "youtube.com"
  - "tiktok.com"
  - "pinterest.com"
  - "reddit.com"
  - "tumblr.com"
  - "flickr.com"
  - "paypal.com"
  - "amazon.com"
  - "ebay.com"
  - "wikipedia.org"
  - "wikimedia.org"
  - "wikidata.org" 
  - "archive.org"
  - "web.archive.org"
  - "aliexpress.com"
  - "etsy.com"
  - "twitch.tv"
  - "alibaba.com"
  - "medium.com"
  - "maps.google.com"
  - "google.com"

max_pages_per_level: 15000     # tetto di sicurezza: alzare per una copertura più ampia
sleep_seconds: 1.0           # pausa tra le richieste (cortesia verso il server)
input_filename: "crawl_service_bund.json"
license: "n/a (harvesting di URL pubblici, nessun contenuto riprodotto)"
