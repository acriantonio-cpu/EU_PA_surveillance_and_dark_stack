# EN: Country configuration for HR. status: ready (runnable); source: site_crawl. Comments are in Italian;
#     'seeds_file' = crawler start URLs in data/input/{ISO}/seeds.txt, 'notes' = data-source notes. See GLOSSARY.md.
country_code: HR
country_name: "Croazia"
status: ready
source_type: site_crawl # bulk_csv
source_name: "Popis tijela javne vlasti (Povjerenik za informiranje)"
source_url: "https://data.gov.hr/dataset/popis-tijela-javne-vlasti"   # sostituire con il link diretto al CSV/export
input_filename: "popis_tijela.csv"
delimiter: ";"
encoding: "utf-8-sig"
license: "aperta (data.gov.hr)"
field_mapping:
  hostname: "Web"
  comune: "Grad"
  regione: "Zupanija"
  codice_ipa: "OIB"
  sector: "TipTijela"
notes: >
  Il dataset è pubblicato in CSV/XML/HTML su data.gov.hr. Sostituire
  'source_url' con il link diretto al file CSV (non la pagina del dataset) e
  verificare i nomi esatti delle colonne (possono essere in croato con
  diacritici, es. "Županija").

# TLD "di fiducia" per continuare a esplorare un dominio anche se non e'
# elencato esplicitamente in 'allowed_domains' (si somma ad essa, non la
# sostituisce): un dominio scoperto durante il crawl e' considerato
# "interno" (e quindi esplorato anche ai livelli successivi) se il suo
# TLD nazionale o un label 'gov' compaiono tra i suoi label. Usato solo
# da source_type: site_crawl; innocuo per gli altri source_type.
allowed_tlds:
  - "hr"
  - "gov"

seeds_file: "seeds.txt"
crawl_depth: 8

# ...poi, a ogni pagina visitata, raccoglie i link USCENTI (siti ufficiali
# degli enti che hanno pubblicato l'annuncio), escludendo i social:
exclude_domains:
exclude_domains:
  - "facebook.com"
  - "twitter.com"
  - "x.com"
  - "linkedin.com"
  - "xing.com"
  - "instagram.com"
  - "youtube.com"
  - "tiktok.com"
  - "pinterest.com"
  - "reddit.com"
  - "tumblr.com"
  - "flickr.com"
  - "paypal.com"
  - "amazon.com"
  - "ebay.com"
  - "wikipedia.org"
  - "wikimedia.org"
  - "wikidata.org" 
  - "archive.org"
  - "web.archive.org"
  - "aliexpress.com"
  - "etsy.com"
  - "twitch.tv"
  - "alibaba.com"
  - "medium.com"
  - "maps.google.com"
  - "google.com"

max_pages_per_level: 15000     # tetto di sicurezza: alzare per una copertura più ampia
sleep_seconds: 1.0           # pausa tra le richieste (cortesia verso il server)
input_filename: "crawl_service_bund.json"
license: "n/a (harvesting di URL pubblici, nessun contenuto riprodotto)"