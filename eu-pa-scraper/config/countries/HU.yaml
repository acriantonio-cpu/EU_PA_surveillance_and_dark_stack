country_code: HU
country_name: "Ungheria"
status: ready
source_type: site_crawl # bulk_xlsx
source_name: "KSH - registro statistico organizzazioni (GSZR) + dati territoriali comuni"
source_url: "https://www.ksh.hu/"   # individuare dataset/export specifico su ksh.hu
input_filename: "ksh_gszr.xlsx"
license: "aperta"
field_mapping:
  hostname: ""
  comune: ""
  regione: ""
  codice_ipa: "torzsszam"
  sector: ""
notes: >
  Nessun registro pubblico unico con campo URL identificato nella ricerca.
  Portale open data nazionale limitato: da esplorare manualmente su ksh.hu
  per individuare l'export scaricabile del GSZR e i dati territoriali dei
  comuni prima di completare il mapping.

# TLD "di fiducia" per continuare a esplorare un dominio anche se non e'
# elencato esplicitamente in 'allowed_domains' (si somma ad essa, non la
# sostituisce): un dominio scoperto durante il crawl e' considerato
# "interno" (e quindi esplorato anche ai livelli successivi) se il suo
# TLD nazionale o un label 'gov' compaiono tra i suoi label. Usato solo
# da source_type: site_crawl; innocuo per gli altri source_type.
allowed_tlds:
  - "hu"
  - "gov"

seeds_file: "seeds.txt"
crawl_depth: 8

# ...poi, a ogni pagina visitata, raccoglie i link USCENTI (siti ufficiali
# degli enti che hanno pubblicato l'annuncio), escludendo i social:
exclude_domains:
exclude_domains:
  - "facebook.com"
  - "twitter.com"
  - "x.com"
  - "linkedin.com"
  - "xing.com"
  - "instagram.com"
  - "youtube.com"
  - "tiktok.com"
  - "pinterest.com"
  - "reddit.com"
  - "tumblr.com"
  - "flickr.com"
  - "paypal.com"
  - "amazon.com"
  - "ebay.com"
  - "wikipedia.org"
  - "wikimedia.org"
  - "wikidata.org" 
  - "archive.org"
  - "web.archive.org"
  - "aliexpress.com"
  - "etsy.com"
  - "twitch.tv"
  - "alibaba.com"
  - "medium.com"
  - "maps.google.com"
  - "google.com"

max_pages_per_level: 15000     # tetto di sicurezza: alzare per una copertura più ampia
sleep_seconds: 1.0           # pausa tra le richieste (cortesia verso il server)
input_filename: "crawl_service_bund.json"
license: "n/a (harvesting di URL pubblici, nessun contenuto riprodotto)"