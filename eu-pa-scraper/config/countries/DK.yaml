# EN: Country configuration for DK. status: ready (runnable); source: site_crawl. Comments are in Italian;
#     'seeds_file' = crawler start URLs in data/input/{ISO}/seeds.txt, 'notes' = data-source notes. See GLOSSARY.md.
country_code: DK
country_name: "Danimarca"
status: ready
source_type: site_crawl # api_json
source_name: "CVR - Det Centrale Virksomhedsregister (Erhvervsstyrelsen)"
source_url: "https://datacvr.virk.dk/api/"   # verificare endpoint/autenticazione esatti (DataCVR/Datafordeleren)
records_path: ""
license: "aperta"
field_mapping:
  hostname: ""                  # CVR non è un directory di siti web PA
  comune: "beliggenhedsadresse.kommune"
  regione: ""
  codice_ipa: "cvrNummer"
  sector: "virksomhedsform"
notes: >
  CVR/Datafordeleren richiede tipicamente registrazione per l'accesso API
  completo: verificare requisiti di autenticazione. Filtrare per forma
  giuridica/settore pubblico. Anagrafe indirizzi disponibile via DAR
  (Danish Address Register, CC BY 4.0) come fonte di normalizzazione comuni.

# TLD "di fiducia" per continuare a esplorare un dominio anche se non e'
# elencato esplicitamente in 'allowed_domains' (si somma ad essa, non la
# sostituisce): un dominio scoperto durante il crawl e' considerato
# "interno" (e quindi esplorato anche ai livelli successivi) se il suo
# TLD nazionale o un label 'gov' compaiono tra i suoi label. Usato solo
# da source_type: site_crawl; innocuo per gli altri source_type.
allowed_tlds:
  - "dk"
  - "gov"


seeds_file: "seeds.txt"
crawl_depth: 8

# ...poi, a ogni pagina visitata, raccoglie i link USCENTI (siti ufficiali
# degli enti che hanno pubblicato l'annuncio), escludendo i social:
exclude_domains:
exclude_domains:
  - "facebook.com"
  - "twitter.com"
  - "x.com"
  - "linkedin.com"
  - "xing.com"
  - "instagram.com"
  - "youtube.com"
  - "tiktok.com"
  - "pinterest.com"
  - "reddit.com"
  - "tumblr.com"
  - "flickr.com"
  - "paypal.com"
  - "amazon.com"
  - "ebay.com"
  - "wikipedia.org"
  - "wikimedia.org"
  - "wikidata.org" 
  - "archive.org"
  - "web.archive.org"
  - "aliexpress.com"
  - "etsy.com"
  - "twitch.tv"
  - "alibaba.com"
  - "medium.com"
  - "maps.google.com"
  - "google.com"

max_pages_per_level: 15000     # tetto di sicurezza: alzare per una copertura più ampia
sleep_seconds: 1.0           # pausa tra le richieste (cortesia verso il server)
input_filename: "crawl_service_bund.json"
license: "n/a (harvesting di URL pubblici, nessun contenuto riprodotto)"