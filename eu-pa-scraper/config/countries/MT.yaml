country_code: MT
country_name: "Malta"
status: ready
source_type: site_crawl # html_scrape
source_name: "portal.data.gov.mt (MITA) + gov.mt / servizz.gov.mt (68 local councils)"
source_url: "https://www.gov.mt/en/Government/Government%20of%20Malta/Pages/Local-Councils.aspx"  # verificare URL corrente dell'elenco local councils
list_selector: "TODO-selettore-CSS"   # ispezionare con DevTools
field_selectors:
  nazev: "TODO"
  web: "a::attr(href)"
license: "SL 546.01"
field_mapping:
  hostname: "web"
  comune: "nazev"
  regione: ""
  codice_ipa: ""
  sector: ""
notes: >
  Universo piccolo (68 local councils): scraping diretto di gov.mt/
  servizz.gov.mt è l'approccio primario più pratico. portal.data.gov.mt
  (piattaforma bespoke, non-CKAN) richiede spesso richieste via eForms per
  i dataset, non un semplice bulk download. Tutto in inglese.

# TLD "di fiducia" per continuare a esplorare un dominio anche se non e'
# elencato esplicitamente in 'allowed_domains' (si somma ad essa, non la
# sostituisce): un dominio scoperto durante il crawl e' considerato
# "interno" (e quindi esplorato anche ai livelli successivi) se il suo
# TLD nazionale o un label 'gov' compaiono tra i suoi label. Usato solo
# da source_type: site_crawl; innocuo per gli altri source_type.
allowed_tlds:
  - "mt"
  - "gov"

allowed_tlds:
  - "pl"
  - "gov"

seeds_file: "seeds.txt"
crawl_depth: 8

# ...poi, a ogni pagina visitata, raccoglie i link USCENTI (siti ufficiali
# degli enti che hanno pubblicato l'annuncio), escludendo i social:
exclude_domains:
exclude_domains:
  - "facebook.com"
  - "twitter.com"
  - "x.com"
  - "linkedin.com"
  - "xing.com"
  - "instagram.com"
  - "youtube.com"
  - "tiktok.com"
  - "pinterest.com"
  - "reddit.com"
  - "tumblr.com"
  - "flickr.com"
  - "paypal.com"
  - "amazon.com"
  - "ebay.com"
  - "wikipedia.org"
  - "wikimedia.org"
  - "wikidata.org" 
  - "archive.org"
  - "web.archive.org"
  - "aliexpress.com"
  - "etsy.com"
  - "twitch.tv"
  - "alibaba.com"
  - "medium.com"
  - "maps.google.com"
  - "google.com"

max_pages_per_level: 15000     # tetto di sicurezza: alzare per una copertura più ampia
sleep_seconds: 1.0           # pausa tra le richieste (cortesia verso il server)
input_filename: "crawl_service_bund.json"
license: "n/a (harvesting di URL pubblici, nessun contenuto riprodotto)"