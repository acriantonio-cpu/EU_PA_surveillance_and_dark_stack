country_code: RO
country_name: "Romania"
status: ready
source_type: site_crawl # bulk_xlsx
source_name: "SIRUTA (INS) + Date de contact institutii publice (data.gov.ro)"
source_url: "https://data.gov.ro/dataset/acces-la-informatii-date-de-contact-institutii-publice"  # sostituire con link diretto al file XLSX
input_filename: "date_contact_institutii.xlsx"
sheet_name: null
header_row: 0
license: "aperta"
field_mapping:
  hostname: "Website"           # verificare nome colonna esatto nel file scaricato
  comune: "Localitate"
  regione: "Judet"
  codice_ipa: "CodSIRUTA"
  sector: "TipInstitutie"
notes: >
  Due dataset da unire: SIRUTA (codici UAT, data.gov.ro) per la struttura
  territoriale e "Date de contact institutii publice" (XLSX) per i contatti
  di prefetture/consilii judetene/primarii, che include già alcuni siti web
  parziali. Verificare i nomi colonna reali dopo il download.

# TLD "di fiducia" per continuare a esplorare un dominio anche se non e'
# elencato esplicitamente in 'allowed_domains' (si somma ad essa, non la
# sostituisce): un dominio scoperto durante il crawl e' considerato
# "interno" (e quindi esplorato anche ai livelli successivi) se il suo
# TLD nazionale o un label 'gov' compaiono tra i suoi label. Usato solo
# da source_type: site_crawl; innocuo per gli altri source_type.
allowed_tlds:
  - "ro"
  - "gov"

allowed_tlds:
  - "pl"
  - "gov"

seeds_file: "seeds.txt"
crawl_depth: 8

# ...poi, a ogni pagina visitata, raccoglie i link USCENTI (siti ufficiali
# degli enti che hanno pubblicato l'annuncio), escludendo i social:
exclude_domains:
exclude_domains:
  - "facebook.com"
  - "twitter.com"
  - "x.com"
  - "linkedin.com"
  - "xing.com"
  - "instagram.com"
  - "youtube.com"
  - "tiktok.com"
  - "pinterest.com"
  - "reddit.com"
  - "tumblr.com"
  - "flickr.com"
  - "paypal.com"
  - "amazon.com"
  - "ebay.com"
  - "wikipedia.org"
  - "wikimedia.org"
  - "wikidata.org" 
  - "archive.org"
  - "web.archive.org"
  - "aliexpress.com"
  - "etsy.com"
  - "twitch.tv"
  - "alibaba.com"
  - "medium.com"
  - "maps.google.com"
  - "google.com"

max_pages_per_level: 15000     # tetto di sicurezza: alzare per una copertura più ampia
sleep_seconds: 1.0           # pausa tra le richieste (cortesia verso il server)
input_filename: "crawl_service_bund.json"
license: "n/a (harvesting di URL pubblici, nessun contenuto riprodotto)"