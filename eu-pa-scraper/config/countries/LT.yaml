country_code: LT
country_name: "Lituania"
status: ready
source_type: site_crawl # api_json
source_name: "JAR - Juridiniu asmenu registras (Registru centras, via data.gov.lt)"
source_url: "https://data.gov.lt/datasets/1484/"   # verificare endpoint API/Saugyklos esatto per il dataset JAR
records_path: "data"
license: "aperta (HVD)"
field_mapping:
  hostname: ""                  # nessun campo URL nei dataset bulk JAR
  comune: "adresas.gyvenviete"
  regione: ""
  codice_ipa: "kodas"
  sector: "evrk2"
notes: >
  data.gov.lt offre il dataset JAR anche in CSV/JSONL/RDF oltre che via
  Saugyklos API: valutare CSV bulk (BulkCSVFetcher) come alternativa più
  semplice se l'API richiede parametri complessi. Filtrare per settore
  istituzionale pubblico. Documentazione disponibile in inglese.

# TLD "di fiducia" per continuare a esplorare un dominio anche se non e'
# elencato esplicitamente in 'allowed_domains' (si somma ad essa, non la
# sostituisce): un dominio scoperto durante il crawl e' considerato
# "interno" (e quindi esplorato anche ai livelli successivi) se il suo
# TLD nazionale o un label 'gov' compaiono tra i suoi label. Usato solo
# da source_type: site_crawl; innocuo per gli altri source_type.
allowed_tlds:
  - "lt"
  - "gov"

allowed_tlds:
  - "pl"
  - "gov"

seeds_file: "seeds.txt"
crawl_depth: 8

# ...poi, a ogni pagina visitata, raccoglie i link USCENTI (siti ufficiali
# degli enti che hanno pubblicato l'annuncio), escludendo i social:
exclude_domains:
exclude_domains:
  - "facebook.com"
  - "twitter.com"
  - "x.com"
  - "linkedin.com"
  - "xing.com"
  - "instagram.com"
  - "youtube.com"
  - "tiktok.com"
  - "pinterest.com"
  - "reddit.com"
  - "tumblr.com"
  - "flickr.com"
  - "paypal.com"
  - "amazon.com"
  - "ebay.com"
  - "wikipedia.org"
  - "wikimedia.org"
  - "wikidata.org" 
  - "archive.org"
  - "web.archive.org"
  - "aliexpress.com"
  - "etsy.com"
  - "twitch.tv"
  - "alibaba.com"
  - "medium.com"
  - "maps.google.com"
  - "google.com"

max_pages_per_level: 15000     # tetto di sicurezza: alzare per una copertura più ampia
sleep_seconds: 1.0           # pausa tra le richieste (cortesia verso il server)
input_filename: "crawl_service_bund.json"
license: "n/a (harvesting di URL pubblici, nessun contenuto riprodotto)"