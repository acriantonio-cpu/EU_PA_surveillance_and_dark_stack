# EN: Country configuration for LV. status: ready (runnable); source: site_crawl. Comments are in Italian;
#     'seeds_file' = crawler start URLs in data/input/{ISO}/seeds.txt, 'notes' = data-source notes. See GLOSSARY.md.
country_code: LV
country_name: "Lettonia"
status: ready
source_type: site_crawl # api_json
source_name: "data.gov.lv (CKAN) + Uznemumu registrs (UR)"
source_url: "https://data.gov.lv/dati/api/3/action/package_search?q=public+bodies"  # affinare query verso il dataset specifico
records_path: "result.results"
license: "aperta"
field_mapping:
  hostname: ""
  comune: ""
  regione: ""
  codice_ipa: "reg_nr"
  sector: ""
notes: >
  data.gov.lv usa API CKAN standard (documentata in EN): individuare il
  dataset specifico con l'elenco enti pubblici (UR - Uznemumu registrs per
  le persone giuridiche) e completare mapping/record_path. Nessun campo
  URL bulk noto.

# TLD "di fiducia" per continuare a esplorare un dominio anche se non e'
# elencato esplicitamente in 'allowed_domains' (si somma ad essa, non la
# sostituisce): un dominio scoperto durante il crawl e' considerato
# "interno" (e quindi esplorato anche ai livelli successivi) se il suo
# TLD nazionale o un label 'gov' compaiono tra i suoi label. Usato solo
# da source_type: site_crawl; innocuo per gli altri source_type.
allowed_tlds:
  - "lv"
  - "gov"

allowed_tlds:
  - "pl"
  - "gov"

seeds_file: "seeds.txt"
crawl_depth: 8

# ...poi, a ogni pagina visitata, raccoglie i link USCENTI (siti ufficiali
# degli enti che hanno pubblicato l'annuncio), escludendo i social:
exclude_domains:
exclude_domains:
  - "facebook.com"
  - "twitter.com"
  - "x.com"
  - "linkedin.com"
  - "xing.com"
  - "instagram.com"
  - "youtube.com"
  - "tiktok.com"
  - "pinterest.com"
  - "reddit.com"
  - "tumblr.com"
  - "flickr.com"
  - "paypal.com"
  - "amazon.com"
  - "ebay.com"
  - "wikipedia.org"
  - "wikimedia.org"
  - "wikidata.org" 
  - "archive.org"
  - "web.archive.org"
  - "aliexpress.com"
  - "etsy.com"
  - "twitch.tv"
  - "alibaba.com"
  - "medium.com"
  - "maps.google.com"
  - "google.com"

max_pages_per_level: 15000     # tetto di sicurezza: alzare per una copertura più ampia
sleep_seconds: 1.0           # pausa tra le richieste (cortesia verso il server)
input_filename: "crawl_service_bund.json"
license: "n/a (harvesting di URL pubblici, nessun contenuto riprodotto)"